name: Soberano Contábil CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  audit-and-test:
    name: Tríplice Auditoria, Vitest (291 Testes) & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Full Vitest Test Suite (129 Test Suites / 291 Tests)
        run: npm test

      - name: Build Web Application (108 Abas Oficiais)
        run: npm run build

      - name: Verify Strict TypeScript Types
        run: npx tsc --noEmit
